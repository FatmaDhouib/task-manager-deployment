# ansible/inventory.yml
all:
  hosts:
    master:
      ansible_host: 192.168.56.10
      ansible_user: vagrant
      ansible_ssh_private_key_file: .vagrant/machines/master/virtualbox/private_key
    worker1:
      ansible_host: 192.168.56.11
      ansible_user: vagrant
      ansible_ssh_private_key_file: .vagrant/machines/worker1/virtualbox/private_key
    worker2:
      ansible_host: 192.168.56.12
      ansible_user: vagrant
      ansible_ssh_private_key_file: .vagrant/machines/worker2/virtualbox/private_key
  children:
    master_node:
      hosts:
        master:
    worker_nodes:
      hosts:
        worker1:
        worker2: